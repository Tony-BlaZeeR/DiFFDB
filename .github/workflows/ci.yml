name: CI

on:
  push:
    branches: [main, dev-dbDiff]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PySide6 su runner headless ha bisogno delle librerie grafiche di sistema
      - name: Dipendenze di sistema per Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Installa le dipendenze
        run: pip install -r requirements-dev.txt

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen   # la GUI si istanzia senza schermo
        run: python -m pytest tests/ -v

  build:
    # Eseguibile portable per ogni sistema: PyInstaller non fa cross-compile.
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pyinstaller DiFFDB.spec
      - uses: actions/upload-artifact@v4
        with:
          name: DiFFDB-${{ matrix.os }}
          path: dist/*
