name: CI

on:
  push:
    branches: [main, dev-dbDiff]
  pull_request:
  workflow_dispatch:

# Permesso minimo di default: i job leggono soltanto. Chi ha bisogno di piu'
# (la release) lo alza esplicitamente nel proprio blocco permissions.
permissions:
  contents: read

jobs:
  qualita:
    name: Lint e sicurezza delle dipendenze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install ruff pip-audit cyclonedx-bom

      - name: Lint
        run: ruff check . --output-format=github

      # Una dipendenza con una vulnerabilita' nota non deve passare in silenzio:
      # e' cosi' che si scopre, non leggendo le mailing list.
      - name: Vulnerabilita' note nelle dipendenze
        run: pip-audit --requirement requirements.txt --progress-spinner off

      # Distinta dei materiali: la chiede la sicurezza aziendale prima di
      # approvare l'adozione, e generarla dopo costa molto piu' che ora.
      - name: SBOM
        run: cyclonedx-py requirements requirements.txt --output-format json --output-file sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  test:
    name: Unitari
    needs: qualita
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PySide6 su runner headless ha bisogno delle librerie grafiche di sistema
      - name: Dipendenze di sistema per Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Installa le dipendenze
        run: pip install -r requirements-dev.txt pytest-cov

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen   # la GUI si istanzia senza schermo
        # La soglia sta sotto la copertura attuale: serve a impedire che scenda,
        # non a inseguire un numero.
        run: >-
          python -m pytest tests/ -v --ignore=tests/integration
          --cov=diffdb --cov-report=term-missing --cov-fail-under=70

      # Una stringa nuova non tradotta comparirebbe in italiano dentro
      # l'interfaccia inglese: meglio accorgersene qui.
      - name: Traduzioni complete
        run: python tools/traduzioni.py --check

  integration:
    name: Integrazione (PostgreSQL, MySQL, SQL Server)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: diffdb_pw1
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 20

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: diffdb_pw1
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdiffdb_pw1"
          --health-interval 5s --health-timeout 5s --health-retries 30

      mssql:
        # Niente health-cmd: l'immagine non porta un client utilizzabile come
        # healthcheck. Si aspetta il server nello step "Attendi SQL Server".
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "DiffDB_pw1!"
          MSSQL_PID: Developer
        ports: ["1433:1433"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements-dev.txt

      - name: Attendi SQL Server
        run: |
          python - <<'PY'
          import time
          import sqlalchemy as sa

          url = "mssql+pymssql://sa:DiffDB_pw1!@localhost:1433/master"
          for tentativo in range(60):
              try:
                  sa.create_engine(url).connect().close()
                  print("SQL Server pronto dopo", tentativo, "tentativi")
                  break
              except Exception as exc:
                  print("...", exc.__class__.__name__)
                  time.sleep(5)
          else:
              raise SystemExit("SQL Server non e' partito")
          PY

      - name: Test di integrazione
        env:
          DIFFDB_TEST_POSTGRESQL_URL: postgresql+psycopg2://postgres:diffdb_pw1@localhost:5432/postgres
          DIFFDB_TEST_MYSQL_URL: mysql+pymysql://root:diffdb_pw1@localhost:3306/mysql
          DIFFDB_TEST_MSSQL_URL: mssql+pymssql://sa:DiffDB_pw1!@localhost:1433/master
          # Qui i tre motori ci sono: se uno non risponde il job deve diventare
          # rosso, non verde con dei test saltati.
          DIFFDB_TEST_STRICT: "1"
        # -p no:pytest-qt: il plugin importa Qt all'avvio, e qui le librerie
        # grafiche di sistema non ci sono. Questi test non usano l'interfaccia.
        # -k: Oracle ha un job suo, e con STRICT attiva saltarlo sarebbe un errore.
        run: python -m pytest tests/integration -v -p no:pytest-qt -k "not oracle"

  integration-oracle:
    name: Integrazione (Oracle)
    runs-on: ubuntu-latest
    needs: test
    services:
      oracle:
        # L'immagine "faststart" parte in un paio di minuti invece di dieci.
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: diffdb_pw1
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s --health-timeout 10s --health-retries 40

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements-dev.txt

      - name: Test di integrazione
        env:
          # oracledb in thin mode: nessun Instant Client da installare.
          DIFFDB_TEST_ORACLE_URL: oracle+oracledb://system:diffdb_pw1@localhost:1521/?service_name=FREEPDB1
          DIFFDB_TEST_STRICT: "1"
        # Come sopra: niente Qt qui, e si seleziona il solo Oracle.
        run: python -m pytest tests/integration -v -p no:pytest-qt -k oracle

  pacchetto:
    name: Wheel e sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install build
      - run: python -m build

      # Il wheel deve contenere le risorse, o l'applicazione installata non
      # trova ne' i .ui ne' le traduzioni: meglio accorgersene qui.
      - name: Le risorse sono nel wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          nomi = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          attesi = ["diffdb/ui/main_window.ui",
                    "diffdb/styles/moderna.qss", "diffdb/styles/retro.qss",
                    "diffdb/images/logo.png", "diffdb/fonts/Inter.ttf",
                    "diffdb/fonts/Silkscreen-Regular.ttf",
                    "diffdb/translations/diffdb_en.qm"]
          mancanti = [a for a in attesi if a not in nomi]
          if mancanti:
              sys.exit("mancano dal wheel: " + ", ".join(mancanti))
          print("risorse presenti nel wheel")
          PY

      - name: Il comando installato funziona
        run: |
          pip install "$(ls dist/*.whl)"
          diffdb --help

      - uses: actions/upload-artifact@v4
        with:
          name: diffdb-pacchetto
          path: dist/*

  build:
    # Eseguibile + installer per ogni sistema: PyInstaller non fa cross-compile.
    # Gira sui tag (per la release) e su workflow_dispatch, per provare gli
    # installer senza pubblicare niente: gli artifact restano, la release no.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [integration, integration-oracle, pacchetto]
    strategy:
      # Un sistema che fallisce il packaging non deve annullare gli altri due.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      - name: Versione
        shell: bash
        run: |
          # Dal tag (v1.3.0 -> 1.3.0) quando c'e', altrimenti da __init__.py:
          # cosi' gli installer hanno un numero sensato anche su workflow_dispatch.
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            V="${{ github.ref_name }}"; V="${V#v}"
          else
            V=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('diffdb/__init__.py', encoding='utf-8').read()).group(1))")
          fi
          echo "DIFFDB_VERSION=$V" >> "$GITHUB_ENV"
          echo "versione: $V"

      - name: Icona .icns (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          # PyInstaller su macOS vuole un .icns per il bundle: lo si costruisce
          # dal PNG con gli strumenti di sistema (niente binario nel repo).
          mkdir -p DiFFDB.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s diffdb/images/logo.png --out "DiFFDB.iconset/icon_${s}x${s}.png"
            d=$((s * 2))
            sips -z $d $d diffdb/images/logo.png --out "DiFFDB.iconset/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns DiFFDB.iconset -o diffdb/images/logo.icns

      - run: pyinstaller DiFFDB.spec

      # --- firma -------------------------------------------------------------
      #
      # Un eseguibile non firmato non e' solo un avviso: con SmartScreen la
      # maggior parte degli utenti si ferma, e dove c'e' AppLocker o WDAC non
      # parte affatto. Su macOS Gatekeeper lo blocca del tutto.
      #
      # Dal giugno 2023 le chiavi dei certificati di firma devono stare su
      # hardware o su un servizio cloud: non si puo' piu' mettere un .pfx in un
      # secret. Qui si usa Azure Trusted Signing; DigiCert KeyLocker e SSL.com
      # eSigner hanno action equivalenti.
      #
      # Senza i secret configurati i passi si saltano e la build produce
      # comunque i binari, non firmati.

      - name: Firma (Windows)
        if: matrix.os == 'windows-latest' && vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          # La marca temporale fa restare valida la firma dopo la scadenza
          # del certificato: senza, i binari "scadono".
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Installer (Windows, Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # L'eseguibile e' gia' firmato (passo sopra): l'installer lo imbarca
          # cosi' com'e'. iscc scrive dist\DiFFDB-Setup-<versione>.exe.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=$env:DIFFDB_VERSION" "packaging\windows\DiFFDB.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC ha restituito $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Firma installer (Windows)
        if: matrix.os == 'windows-latest' && vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Firma e notarizzazione (macOS)
        if: matrix.os == 'macos-latest' && vars.MACOS_SIGNING_IDENTITY != ''
        env:
          CERTIFICATO: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATO_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITA: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail

          # Portachiavi usa e getta: il certificato non resta sul runner.
          echo "$CERTIFICATO" | base64 --decode > certificato.p12
          security create-keychain -p azione build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p azione build.keychain
          security import certificato.p12 -k build.keychain -P "$CERTIFICATO_PW" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k azione build.keychain
          rm certificato.p12

          # Hardened runtime: senza, la notarizzazione viene rifiutata. Si firma
          # e notarizza il bundle .app (--deep per i binari Qt dentro).
          codesign --deep --force --options runtime --timestamp --sign "$IDENTITA" dist/DiFFDB.app

          ditto -c -k --keepParent dist/DiFFDB.app dist/DiFFDB.zip
          xcrun notarytool submit dist/DiFFDB.zip --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/DiFFDB.app || true
          rm dist/DiFFDB.zip

      - name: DMG (macOS)
        if: matrix.os == 'macos-latest'
        env:
          IDENTITA: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          dmg="dist/DiFFDB-${DIFFDB_VERSION}.dmg"
          hdiutil create -volname "DiFFDB" -srcfolder "dist/DiFFDB.app" \
            -ov -format UDZO "$dmg"
          # Se la firma e' configurata, si notarizza e si incolla il ticket al dmg.
          if [ -n "${IDENTITA:-}" ]; then
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$dmg" || true
          fi
          # Il binario nudo e il bundle non vanno distribuiti a parte: resta il dmg.
          rm -rf dist/DiFFDB dist/DiFFDB.app

      - name: AppImage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          appdir=DiFFDB.AppDir
          mkdir -p "$appdir/usr/bin"
          cp dist/DiFFDB "$appdir/usr/bin/DiFFDB"
          cp packaging/linux/AppRun "$appdir/AppRun"
          cp packaging/linux/DiFFDB.desktop "$appdir/DiFFDB.desktop"
          cp diffdb/images/logo.png "$appdir/DiFFDB.png"
          chmod +x "$appdir/AppRun" "$appdir/usr/bin/DiFFDB"
          wget -qO appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          # I runner non hanno FUSE: --appimage-extract-and-run lo evita.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            "$appdir" "dist/DiFFDB-${DIFFDB_VERSION}-x86_64.AppImage"
          # Il binario portabile resta, ma con un nome che non collide col macOS.
          mv dist/DiFFDB "dist/DiFFDB-linux-x86_64"
          ls -l dist

      - name: Impronte dei file
        shell: bash
        run: |
          cd dist
          # Chi scarica deve poter verificare cosa ha scaricato. Solo i file:
          # su macOS un bundle .app e' una cartella e manderebbe in errore lo
          # strumento di hash.
          tool="sha256sum"
          command -v sha256sum > /dev/null || tool="shasum -a 256"
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 \
            | xargs -0 $tool > "SHA256SUMS-${{ matrix.os }}.txt"
          cat "SHA256SUMS-${{ matrix.os }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DiFFDB-${{ matrix.os }}
          path: |
            dist/*
            !dist/DiFFDB.app
            !dist/DiFFDB.iconset

  release:
    # Gli artifact scadono dopo 90 giorni: il link che dai a un collega smette
    # di funzionare. Una release vera resta.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Raccogli i file
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
